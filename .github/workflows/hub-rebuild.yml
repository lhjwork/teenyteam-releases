# 허브 검색용 페이지를 하루 한 번 다시 만든다(새로 승인된 프롬프트·에이전트가 sitemap에 들어가게).
# 이 파일은 공개 저장소 lhjwork/teenyteam-releases 의 .github/workflows/hub-rebuild.yml 로 넣는다(공개 저장소는 Actions 무료).
# 비밀값 HUB_DEPLOY_HOOK = Vercel teenyteam-hub → Settings → Git → Deploy Hooks 주소.
name: hub-rebuild
on:
  schedule: [{ cron: "17 18 * * *" }]   # 매일 한국 시간 03:17
  workflow_dispatch:
jobs:
  hook:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: '[ -n "$HOOK" ] && curl -fsS -X POST "$HOOK" || echo "HUB_DEPLOY_HOOK 없음"'
        env: { HOOK: "${{ secrets.HUB_DEPLOY_HOOK }}" }
